<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Green circle background -->
  <circle cx="16" cy="16" r="16" fill="#16a34a"/>
  <!-- Wheat stalk -->
  <line x1="16" y1="28" x2="16" y2="8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheat grains left -->
  <ellipse cx="12" cy="14" rx="3.5" ry="2" fill="#fff" transform="rotate(-30 12 14)"/>
  <ellipse cx="11" cy="19" rx="3.5" ry="2" fill="#fff" transform="rotate(-25 11 19)"/>
  <!-- Wheat grains right -->
  <ellipse cx="20" cy="14" rx="3.5" ry="2" fill="#fff" transform="rotate(30 20 14)"/>
  <ellipse cx="21" cy="19" rx="3.5" ry="2" fill="#fff" transform="rotate(25 21 19)"/>
  <!-- Top grain -->
  <ellipse cx="16" cy="10" rx="2.5" ry="3" fill="#fff"/>
</svg>
