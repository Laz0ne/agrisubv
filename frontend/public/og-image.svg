<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="50%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="220" fill="rgba(255,255,255,0.05)"/>
  <circle cx="150" cy="530" r="160" fill="rgba(255,255,255,0.05)"/>

  <!-- Wheat icon (centered left) -->
  <g transform="translate(160,215) scale(5)">
    <line x1="16" y1="40" x2="16" y2="0" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="10" cy="12" rx="5" ry="3" fill="rgba(255,255,255,0.9)" transform="rotate(-30 10 12)"/>
    <ellipse cx="8"  cy="22" rx="5" ry="3" fill="rgba(255,255,255,0.9)" transform="rotate(-25 8 22)"/>
    <ellipse cx="22" cy="12" rx="5" ry="3" fill="rgba(255,255,255,0.9)" transform="rotate(30 22 12)"/>
    <ellipse cx="24" cy="22" rx="5" ry="3" fill="rgba(255,255,255,0.9)" transform="rotate(25 24 22)"/>
    <ellipse cx="16" cy="4"  rx="4"  ry="5" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- Main title -->
  <text x="420" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="white" letter-spacing="-2">AgriSubv</text>

  <!-- Tagline -->
  <text x="420" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="rgba(255,255,255,0.85)">Trouvez vos aides agricoles en 3 minutes</text>

  <!-- Sub-line -->
  <text x="420" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.65)">PAC · Aides régionales · Conversion bio · Jeune agriculteur</text>

  <!-- Badge -->
  <rect x="420" y="440" width="240" height="50" rx="25" fill="rgba(255,255,255,0.15)"/>
  <text x="540" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">100% gratuit</text>
</svg>
